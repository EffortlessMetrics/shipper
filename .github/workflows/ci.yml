name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      runner_route:
        description: 'Full-CI route. Hosted is an explicit, potentially expensive proof run.'
        type: choice
        required: false
        default: self-hosted
        options:
          - self-hosted
          - github-hosted
  schedule:
    # Nightly quick fuzz and elevated property tests
    - cron: '0 3 * * 0'

concurrency:
  group: ci-${{ github.ref }}${{ github.repository == 'EffortlessMetrics/shipper-swarm' && github.event_name == 'workflow_dispatch' && inputs.runner_route == 'github-hosted' && '-manual-hosted' || '' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

# Least privilege - default to read-only
permissions:
  contents: read

jobs:
  lint:
    name: Lint (fmt + clippy)
    if: &default_runners >-
      ${{ github.event_name != 'pull_request' && !(github.repository == 'EffortlessMetrics/shipper-swarm' && github.event_name == 'workflow_dispatch' && inputs.runner_route == 'github-hosted') }}
    runs-on:
      group: em-ci-small
      labels: [self-hosted, linux, x64, em-ci, cx43, rust-medium, trusted-pr]
    steps: &lint_steps
      - uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.environment == 'github-hosted' && 'manual-hosted-' || '' }}${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.environment == 'github-hosted' && 'manual-hosted-' || '' }}${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  policy:
    # File-policy enforcement.
    #
    # As of rollout PR 12 (#211): all seven file-policy checks run in
    # --mode blocking-allowlist. CI fails on unreceipted files, missing
    # required fields, or expired entries in any of:
    #
    #   - non-Rust file allowlist (policy/non-rust-allowlist.toml)
    #   - generated allowlist
    #   - executable allowlist
    #   - dependency-surface allowlist
    #   - workflow allowlist
    #   - process policy (per-workflow command set)
    #   - network policy (per-workflow endpoint set)
    #
    # The check-process-policy detector was refined in PR 12 to only
    # consider the first word of each shell command inside `run:` blocks
    # (see xtask/src/workflow_checks.rs::detect_commands_in_runs), so
    # build-target names like `shipper` no longer false-positive.
    #
    # `blocking-strict` mode (fails on unused entries + stale review
    # dates) remains out of scope until a dedicated cleanup pass.
    #
    # Source-of-truth document contracts run in advisory mode first. They
    # produce target/policy/doc-contracts-report.* but do not gate merges yet.
    #
    # The unified policy-report runs at the end and uploads
    # target/policy/ as a `policy-reports` artifact regardless of
    # pass/fail (`if: always()`). See docs/policy/NON_RUST_ROLLOUT.md.
    name: Policy
    if: *default_runners
    runs-on:
      group: em-ci-small
      labels: [self-hosted, linux, x64, em-ci, cx43, rust-medium, trusted-pr]
    steps: &policy_steps
      - uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.environment == 'github-hosted' && 'manual-hosted-' || '' }}${{ runner.os }}-cargo-policy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.environment == 'github-hosted' && 'manual-hosted-' || '' }}${{ runner.os }}-cargo-policy-

      - name: Verify manual full-CI routing contract
        run: python3 scripts/ci/check-full-ci-hosted.py --test

      - name: check-file-policy (blocking-allowlist)
        run: cargo xtask check-file-policy --mode blocking-allowlist

      - name: check-generated (blocking-allowlist)
        run: cargo xtask check-generated --mode blocking-allowlist

      - name: check-executable-files (blocking-allowlist)
        run: cargo xtask check-executable-files --mode blocking-allowlist

      - name: check-dependency-surfaces (blocking-allowlist)
        run: cargo xtask check-dependency-surfaces --mode blocking-allowlist

      - name: check-workflow-surfaces (blocking-allowlist)
        run: cargo xtask check-workflow-surfaces --mode blocking-allowlist

      - name: check-process-policy (blocking-allowlist)
        run: cargo xtask check-process-policy --mode blocking-allowlist

      - name: check-network-policy (blocking-allowlist)
        run: cargo xtask check-network-policy --mode blocking-allowlist

      - name: check-doc-contracts (advisory)
        run: cargo xtask check-doc-contracts --mode advisory

      - name: Unified policy report
        if: always()
        run: cargo xtask policy-report

      - name: Upload policy reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: policy-reports
          path: target/policy/
          if-no-files-found: error
          retention-days: 30

  test:
    name: Tests (nextest)
    if: *default_runners
    runs-on:
      group: em-ci-small
      labels: [self-hosted, linux, x64, em-ci, cx43, rust-medium, trusted-pr]
    steps: &test_steps
      - uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.environment == 'github-hosted' && 'manual-hosted-' || '' }}${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.environment == 'github-hosted' && 'manual-hosted-' || '' }}${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo nextest run --workspace --all-features --profile ci
        env:
          # Keep snapshots from updating in CI
          INSTA_UPDATE: "no"
          # PR test lane runs reduced proptest intensity on every trigger.
          # Full-strength crypto proving lives in the `crypto-proptests-heavy`
          # job below (schedule + push-main + dispatch).
          PROPTEST_CASES: "16"
          PROPTEST_MAX_SHRINK_ITERS: "1000"

      - name: Run doc tests
        run: cargo test --workspace --doc

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-tests
          path: target/nextest/ci/junit.xml
          retention-days: 14

  install-smoke:
    name: Install Smoke
    if: *default_runners
    runs-on:
      group: em-ci-small
      labels: [self-hosted, linux, x64, em-ci, cx43, rust-medium, trusted-pr]
    steps: &install_smoke_steps
      - uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.environment == 'github-hosted' && 'manual-hosted-' || '' }}${{ runner.os }}-cargo-install-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.environment == 'github-hosted' && 'manual-hosted-' || '' }}${{ runner.os }}-cargo-install-

      - name: Install shipper facade crate
        run: |
          cargo install --path crates/shipper --locked --root "$RUNNER_TEMP/shipper-install"
          echo "$RUNNER_TEMP/shipper-install/bin" >> "$GITHUB_PATH"

      - name: Verify installed shipper
        run: |
          shipper --version
          shipper --help
          shipper doctor --help
          shipper plan --help
          shipper preflight --help

  crypto-proptests-heavy:
    name: Crypto Proptests (full strength)
    # Deep crypto proving lane. The PR test lane above runs proptests with
    # reduced intensity (PROPTEST_CASES=16) so that `shipper-encrypt`'s
    # Argon2-bound property tests don't dominate wall clock on every PR.
    # This job restores full-strength coverage on:
    #   - nightly schedule (0 3 * * *)
    #   - direct pushes to main
    #   - manual workflow_dispatch
    # It intentionally does NOT run on pull_request to keep developer
    # feedback fast; if you want a specific PR to exercise it, use the
    # workflow_dispatch trigger on the PR's branch.
    if: >-
      ${{ github.event_name != 'pull_request' && !(github.repository == 'EffortlessMetrics/shipper-swarm' && github.event_name == 'workflow_dispatch' && inputs.runner_route == 'github-hosted') && (github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on:
      group: em-ci-small
      labels: [self-hosted, linux, x64, em-ci, cx53, rust-large, trusted-pr]
    timeout-minutes: 90
    steps: &crypto_proptests_heavy_steps
      - uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.environment == 'github-hosted' && 'manual-hosted-' || '' }}${{ runner.os }}-cargo-crypto-heavy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.environment == 'github-hosted' && 'manual-hosted-' || '' }}${{ runner.os }}-cargo-crypto-heavy-

      - name: Run shipper-encrypt proptests at full strength
        run: cargo nextest run -p shipper-encrypt --all-features --profile ci
        env:
          INSTA_UPDATE: "no"
          PROPTEST_CASES: "256"

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-crypto-heavy
          path: target/nextest/ci/junit.xml
          retention-days: 14

  msrv:
    name: MSRV Check
    if: *default_runners
    runs-on:
      group: em-ci-small
      labels: [self-hosted, linux, x64, em-ci, cx43, rust-medium, trusted-pr]
    steps: &msrv_steps
      - uses: actions/checkout@v7.0.1
        id: msrv-checkout

      - name: Install Rust (MSRV)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.environment == 'github-hosted' && 'manual-hosted-' || '' }}${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.environment == 'github-hosted' && 'manual-hosted-' || '' }}${{ runner.os }}-cargo-msrv-

      - name: Check locked workspace with Rust 1.95.0
        env:
          CHECKOUT_SHA: ${{ steps.msrv-checkout.outputs.commit }}
        run: |
          set -euo pipefail
          printf 'checkout_sha=%s\n' "$CHECKOUT_SHA"
          [[ -n "$CHECKOUT_SHA" && "$CHECKOUT_SHA" == "$GITHUB_SHA" ]]
          sha256sum Cargo.lock
          RUSTC=$(rustup which --toolchain 1.95.0 rustc)
          export RUSTC CARGO_BUILD_RUSTC="$RUSTC"
          export RUSTC_WRAPPER="" RUSTC_WORKSPACE_WRAPPER=""
          export CARGO_BUILD_RUSTC_WRAPPER="" CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER=""
          rustc_version=$("$RUSTC" -vV)
          printf '%s\n' "$rustc_version"
          [[ $'\n'"$rustc_version"$'\n' == *$'\nrelease: 1.95.0\n'* ]]
          cargo +1.95.0 -vV
          cargo +1.95.0 check --workspace --locked

  security:
    name: Security Audit
    if: *default_runners
    runs-on:
      group: em-ci-small
      labels: [self-hosted, linux, x64, em-ci, cx43, rust-medium, trusted-pr]
    steps: &security_steps
      - uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run security audit
        # The advisory-db cache lives under $CARGO_HOME on the persistent
        # self-hosted runner. An interrupted fetch can leave it as a
        # non-empty but invalid directory, which makes cargo-audit refuse to
        # reinitialize it ("Refusing to initialize the non-empty directory as
        # .../advisory-db") on every subsequent run. Remove a stale db so
        # cargo-audit performs a clean clone; the advisory-db is small, so the
        # re-clone cost per run is negligible.
        run: |
          rm -rf "${CARGO_HOME:-$HOME/.cargo}/advisory-db"
          cargo audit

  docs:
    name: Documentation
    if: *default_runners
    runs-on:
      group: em-ci-small
      labels: [self-hosted, linux, x64, em-ci, cx43, rust-medium, trusted-pr]
    steps: &docs_steps
      - uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.environment == 'github-hosted' && 'manual-hosted-' || '' }}${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.environment == 'github-hosted' && 'manual-hosted-' || '' }}${{ runner.os }}-cargo-docs-

      - name: Build documentation
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -Dwarnings

  bdd:
    name: BDD Tests
    if: *default_runners
    runs-on:
      group: em-ci-small
      labels: [self-hosted, linux, x64, em-ci, cx43, rust-medium, trusted-pr]
    needs: [lint]
    steps: &bdd_steps
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.environment == 'github-hosted' && 'manual-hosted-' || '' }}${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.environment == 'github-hosted' && 'manual-hosted-' || '' }}${{ runner.os }}-cargo-

      - name: Run publish BDD tests
        run: cargo test -p shipper-cli --test bdd_publish -- --nocapture

      - name: Run resume BDD tests
        run: cargo test -p shipper-cli --test bdd_resume -- --nocapture

      - name: Run synthetic interruption resume rehearsal
        run: cargo test -p shipper-cli --test e2e_rehearse -- --nocapture

  fuzz-smoke:
    name: Fuzz Smoke (PR)
    if: >-
      ${{ github.event_name != 'pull_request' && !(github.repository == 'EffortlessMetrics/shipper-swarm' && github.event_name == 'workflow_dispatch' && inputs.runner_route == 'github-hosted') && (github.event_name != 'schedule') }}
    runs-on:
      group: em-ci-small
      labels: [self-hosted, linux, x64, em-ci, cx53, rust-large, trusted-pr]
    needs: [lint]
    steps: &fuzz_smoke_steps
      - uses: actions/checkout@v7.0.1

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          components: rust-src

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Cache Cargo + fuzz
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            fuzz/target
          key: ${{ runner.environment == 'github-hosted' && 'manual-hosted-' || '' }}${{ runner.os }}-fuzz-${{ hashFiles('**/Cargo.lock', 'fuzz/Cargo.toml') }}
          restore-keys: ${{ runner.environment == 'github-hosted' && 'manual-hosted-' || '' }}${{ runner.os }}-fuzz-

      - name: Run fuzz targets briefly
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: |
          cargo fuzz run load_state --target x86_64-unknown-linux-gnu -- -max_total_time=60
          cargo fuzz run resolve_token --target x86_64-unknown-linux-gnu -- -max_total_time=60
          cargo fuzz run schema_version --target x86_64-unknown-linux-gnu -- -max_total_time=60
          cargo fuzz run release_levels --target x86_64-unknown-linux-gnu -- -max_total_time=60
          cargo fuzz run redact_output --target x86_64-unknown-linux-gnu -- -max_total_time=60

  cross-platform:
    name: Target Check (${{ matrix.target }})
    if: *default_runners
    runs-on:
      group: em-ci-small
      labels: [self-hosted, linux, x64, em-ci, cx43, rust-medium, trusted-pr]
    strategy: &target_strategy
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
    steps: &cross_platform_steps
      - uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add cross-compilation target
        run: rustup target add ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.environment == 'github-hosted' && 'manual-hosted-' || '' }}${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.environment == 'github-hosted' && 'manual-hosted-' || '' }}${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Check target
        run: cargo check --workspace --target ${{ matrix.target }}

  release-build:
    name: Release Build
    # Keep release-profile compile proof available on main and manual dispatch,
    # but out of the default PR and nightly critical paths. Tag-time release
    # binaries are built by release.yml.
    if: >-
      ${{ github.event_name != 'pull_request' && !(github.repository == 'EffortlessMetrics/shipper-swarm' && github.event_name == 'workflow_dispatch' && inputs.runner_route == 'github-hosted') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on:
      group: em-ci-small
      labels: [self-hosted, linux, x64, em-ci, cx53, rust-large, trusted-pr]
    needs: [lint, test]
    steps: &release_build_steps
      - uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.environment == 'github-hosted' && 'manual-hosted-' || '' }}${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.environment == 'github-hosted' && 'manual-hosted-' || '' }}${{ runner.os }}-cargo-release-

      - name: Build release
        run: cargo build --release

      - name: Upload release binary
        uses: actions/upload-artifact@v7
        with:
          name: shipper-linux-x86_64
          path: target/release/shipper
          retention-days: 7

  # Manual proof reuses each original job's exact steps and target matrix.
  # The default group/label routes above remain the push/schedule/default path.

  lint-hosted:
    name: Lint (fmt + clippy) (manual hosted)
    if: &manual_hosted >-
      ${{ github.repository == 'EffortlessMetrics/shipper-swarm' && github.event_name == 'workflow_dispatch' && inputs.runner_route == 'github-hosted' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps: *lint_steps

  # Reuse the canonical policy steps, without admitting other full-CI jobs on PRs.
  policy-hosted:
    name: Policy (review-ready or manual hosted)
    if: >-
      ${{ (github.repository == 'EffortlessMetrics/shipper-swarm' && github.event_name == 'workflow_dispatch' && inputs.runner_route == 'github-hosted') || (github.repository == 'EffortlessMetrics/shipper-swarm' && github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps: *policy_steps

  test-hosted:
    name: Tests (nextest) (manual hosted)
    if: *manual_hosted
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps: *test_steps

  install-smoke-hosted:
    name: Install Smoke (manual hosted)
    if: *manual_hosted
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps: *install_smoke_steps

  crypto-proptests-heavy-hosted:
    name: Crypto Proptests (full strength) (manual hosted)
    if: *manual_hosted
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps: *crypto_proptests_heavy_steps

  msrv-hosted:
    name: MSRV Check (manual hosted)
    if: *manual_hosted
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps: *msrv_steps

  security-hosted:
    name: Security Audit (manual hosted)
    if: *manual_hosted
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps: *security_steps

  docs-hosted:
    name: Documentation (manual hosted)
    if: *manual_hosted
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps: *docs_steps

  bdd-hosted:
    name: BDD Tests (manual hosted)
    if: *manual_hosted
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [lint-hosted]
    steps: *bdd_steps

  fuzz-smoke-hosted:
    name: Fuzz Smoke (PR) (manual hosted)
    if: *manual_hosted
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [lint-hosted]
    steps: *fuzz_smoke_steps

  cross-platform-hosted:
    name: Target Check (${{ matrix.target }}) (manual hosted)
    if: *manual_hosted
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy: *target_strategy
    steps: *cross_platform_steps

  release-build-hosted:
    name: Release Build (manual hosted)
    if: *manual_hosted
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [lint-hosted, test-hosted]
    steps: *release_build_steps
